[package]
name = "photocraft-algo"
version = "0.18.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
photocraft-geom = { path = "../geom" }
photocraft-color = { path = "../color" }
photocraft-raster = { path = "../raster" }
serde = { version = "1", features = ["derive", "rc"] }
rustfft = "6.4.1"
[ target.'cfg(not(target_arch = "wasm32"))'.dependencies ]
rayon = "1"
